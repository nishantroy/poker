name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if a game is in play"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public
      # Never ship a new build while a game is in play: wait up to 5 hours for it to finish.
      # Emergency fix: re-run this workflow with the "force" input, or deploy locally with `npm run deploy:force`.
      - name: Wait until no game is in play
        if: ${{ !inputs.force }}
        run: node scripts/deploy-guard.mjs --wait --max-wait 300
        timeout-minutes: 310
      - name: wrangler deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
